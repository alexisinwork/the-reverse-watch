# Project-scoped Codex configuration. Credentials are read from environment
# variables and must never be hardcoded in this file.

[mcp_servers.openai_docs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
default_tools_approval_mode = "auto"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
default_tools_approval_mode = "auto"

[mcp_servers.perplexity]
url = "https://api.perplexity.ai/mcp"
bearer_token_env_var = "PERPLEXITY_API_KEY"
enabled = true
required = false
default_tools_approval_mode = "auto"

[mcp_servers.vercel]
url = "https://mcp.vercel.com"
auth = "oauth"
enabled = true
required = false
default_tools_approval_mode = "auto"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
enabled = true
required = false
default_tools_approval_mode = "auto"

[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?project_ref=osfqexnzgkksfvaocjvl&features=docs%2Caccount%2Cdatabase%2Cdebugging%2Cdevelopment%2Cfunctions%2Cbranching"
auth = "oauth"
enabled = true
required = false
default_tools_approval_mode = "auto"

# Browser automation remains disabled until Phase 5 integration verification,
# after the core AI work through Phase 4 is complete.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = false
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60
default_tools_approval_mode = "prompt"
